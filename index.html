<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic — a guide, not an answer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; }

body {
  --ink: #1C2333;
  --ink-soft: #262E42;
  --paper: #F6F1E4;
  --rule: #C9BFA6;
  --accent: #D8933C;
  --accent-dim: #B87A2C;
  --sage: #6B8F71;
  --text-ink: #2A2318;
  --text-ink-soft: #6b6250;
  --text-paper: #EDE6D6;
  --text-paper-dim: #9AA1B5;

  margin: 0;
  background: var(--ink);
  color: var(--text-paper);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 48px 20px 80px;
  display: flex;
  justify-content: center;
}

.wrap { width: 100%; max-width: 640px; }

.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 10px;
}
.title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 34px;
  line-height: 1.15;
  margin: 0 0 12px;
}
.sub {
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text-paper-dim);
  max-width: 480px;
  margin: 0 0 36px;
}

.card {
  background: var(--paper);
  border-radius: 3px;
  padding: 28px 26px 26px;
  position: relative;
  box-shadow: 0 24px 60px -20px rgba(0,0,0,0.55);
}
.card::before {
  content: '';
  position: absolute;
  left: 54px; top: 0; bottom: 0;
  width: 1px;
  background: var(--rule);
  opacity: 0.7;
}
.label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-ink-soft);
  margin: 0 0 10px 62px;
}
textarea.input {
  width: calc(100% - 62px);
  margin-left: 62px;
  min-height: 84px;
  border: none;
  background: transparent;
  font-family: 'Fraunces', serif;
  font-size: 19px;
  color: var(--text-ink);
  resize: vertical;
  outline: none;
  line-height: 1.4;
}
textarea.input::placeholder { color: #b8ab8a; }

.btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--text-paper);
  border: none;
  padding: 13px 22px;
  border-radius: 2px;
  cursor: pointer;
}
.btn:hover { background: var(--ink-soft); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-row { margin-left: 62px; margin-top: 14px; }

.ghost {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  background: none;
  border: none;
  color: var(--text-ink-soft);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.loading {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--text-paper-dim);
  margin-top: 22px;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.1s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 1; } }

.reframe {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-paper-dim);
  border-left: 2px solid var(--accent-dim);
  padding-left: 14px;
  margin: 0 0 34px;
}

.trail { display: flex; gap: 22px; align-items: flex-start; }
.rail { display: flex; flex-direction: column; align-items: center; padding-top: 6px; flex-shrink: 0; }
.node {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--ink-soft);
  border: 1.5px solid var(--text-paper-dim);
  flex-shrink: 0;
}
.node.done { background: var(--sage); border-color: var(--sage); }
.node.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(216,147,60,0.18); }
.line { width: 1.5px; flex: 1; background: var(--text-paper-dim); opacity: 0.35; min-height: 30px; }
.line.done { background: var(--sage); opacity: 0.6; }

.steps { flex: 1; display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.step { animation: rise 0.35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.step-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 6px;
}
.step-prompt {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  line-height: 1.45;
  margin: 0 0 12px;
}
.notes {
  width: 100%;
  background: var(--ink-soft);
  border: 1px solid #3a4258;
  border-radius: 3px;
  color: var(--text-paper);
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  padding: 10px 12px;
  min-height: 54px;
  resize: vertical;
  outline: none;
}
.notes::placeholder { color: #6d7590; }
.notes:focus { border-color: var(--accent-dim); }

.hint {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--accent);
  background: rgba(216,147,60,0.08);
  border-left: 2px solid var(--accent-dim);
  padding: 8px 10px;
  border-radius: 2px;
}

.advance { margin-top: 10px; }

.final {
  margin-top: 8px;
  padding: 18px 18px 20px;
  background: var(--ink-soft);
  border: 1px solid #3a4258;
  border-radius: 3px;
}
.final-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--sage);
  margin: 0 0 8px;
}
.final-text {
  font-family: 'Fraunces', serif;
  font-size: 16.5px;
  line-height: 1.5;
  margin: 0 0 14px;
}
.feedback {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-paper-dim);
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed #3a4258;
}

.error {
  font-size: 13px;
  color: #d98080;
  margin-top: 12px;
  font-family: 'IBM Plex Mono', monospace;
}

.restart { margin-top: 40px; display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function() {
  const root = document.getElementById('app');

  const savedProfile = (() => {
    try { return JSON.parse(localStorage.getItem('sq-profile') || 'null'); } catch (e) { return null; }
  })();

  const state = {
    phase: savedProfile ? 'intro' : 'profile',
    profile: savedProfile || { country: '', year: '', age: '' },
    question: '',
    reframe: '',
    steps: [],
    revealed: 1,
    notes: {},
    reflection: '',
    feedback: '',
    feedbackLoading: false,
    errorMsg: ''
  };

  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function generateGuide(question) {
    const res = await fetch('/api/guide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, profile: state.profile })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function generateFeedback() {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: state.question,
        steps: state.steps,
        notes: state.notes,
        reflection: state.reflection
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data.feedback;
  }

  function render() {
    if (state.phase === 'profile') {
      root.innerHTML = `
        <p class="eyebrow">— before we begin</p>
        <h1 class="title">Quick bit of context.</h1>
        <p class="sub">This helps the guide match your school level and curriculum, rather than guessing.</p>
        <div class="card">
          <p class="label">Country</p>
          <textarea class="input" id="p-country" style="min-height:auto;height:44px;" placeholder="e.g. United Kingdom">${esc(state.profile.country)}</textarea>
        </div>
        <div class="card" style="margin-top:18px;">
          <p class="label">School year / grade</p>
          <textarea class="input" id="p-year" style="min-height:auto;height:44px;" placeholder="e.g. Year 9, or Grade 8">${esc(state.profile.year)}</textarea>
        </div>
        <div class="card" style="margin-top:18px;">
          <p class="label">Age</p>
          <textarea class="input" id="p-age" style="min-height:auto;height:44px;" placeholder="e.g. 14">${esc(state.profile.age)}</textarea>
        </div>
        <div class="btn-row" style="margin-left:0;">
          <button class="btn" id="p-continue">Continue</button>
        </div>
        ${state.errorMsg ? `<p class="error">${esc(state.errorMsg)}</p>` : ''}
      `;
      document.getElementById('p-country').addEventListener('input', e => state.profile.country = e.target.value);
      document.getElementById('p-year').addEventListener('input', e => state.profile.year = e.target.value);
      document.getElementById('p-age').addEventListener('input', e => state.profile.age = e.target.value);
      document.getElementById('p-continue').addEventListener('click', () => {
        if (!state.profile.country.trim() || !state.profile.year.trim() || !state.profile.age.trim()) {
          state.errorMsg = 'Please fill in all three before continuing.';
          render();
          return;
        }
        state.errorMsg = '';
        localStorage.setItem('sq-profile', JSON.stringify(state.profile));
        state.phase = 'intro';
        render();
      });
      return;
    }

    if (state.phase === 'intro' || state.phase === 'loading') {
      root.innerHTML = `
        <p class="eyebrow">— a guide, not an answer</p>
        <h1 class="title">Ask something.<br/>Find your own way there.</h1>
        <p class="sub">Put in a question. Instead of the answer, you'll get a sequence of steps built to lead you to it yourself — the way a good tutor would, not a search engine.</p>
        <p style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-paper-dim);margin:0 0 20px;">
          ${esc(state.profile.year)}, age ${esc(state.profile.age)}, ${esc(state.profile.country)} —
          <button class="ghost" id="edit-profile" style="font-size:12px;">change</button>
        </p>
        <div class="card">
          <p class="label">Your question</p>
          <textarea class="input" id="q" placeholder="e.g. Why does the sky turn red at sunset?">${esc(state.question)}</textarea>
          <div class="btn-row">
            <button class="btn" id="go" ${state.phase==='loading' ? 'disabled' : ''}>${state.phase==='loading' ? 'Thinking…' : 'Begin'}</button>
          </div>
        </div>
        ${state.phase === 'loading' ? `<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Mapping out a path, not the destination</div>` : ''}
        ${state.errorMsg ? `<p class="error">${esc(state.errorMsg)}</p>` : ''}
      `;
      const qEl = document.getElementById('q');
      qEl.addEventListener('input', e => state.question = e.target.value);
      document.getElementById('go').addEventListener('click', onBegin);
      qEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) onBegin(); });
      document.getElementById('edit-profile').addEventListener('click', () => { state.phase = 'profile'; render(); });
      return;
    }

    if (state.phase === 'guide') {
      const total = state.steps.length;
      const stepsHtml = state.steps.slice(0, state.revealed).map((s, i) => {
        const isLast = i === state.revealed - 1;
        const showAdvance = isLast && i < total - 1;
        const showFinal = isLast && i === total - 1;
        return `
          <div class="step">
            <p class="step-label">${i+1} / ${total} — ${esc(s.label)}</p>
            <p class="step-prompt">${esc(s.prompt)}</p>
            <textarea class="notes" placeholder="jot your thinking here (optional)" data-notes-idx="${i}">${esc(state.notes[i] || '')}</textarea>
            <div class="hint">nudge — ${esc(s.hint)}</div>
            ${showAdvance ? `<div class="advance"><button class="btn" data-advance="1">Next step</button></div>` : ''}
            ${showFinal ? renderFinal() : ''}
          </div>
        `;
      }).join('');

      const railHtml = state.steps.map((s, i) => {
        const done = i < state.revealed - 1;
        const active = i === state.revealed - 1;
        return `
          <div class="node ${done ? 'done' : active ? 'active' : ''}"></div>
          ${i < total - 1 ? `<div class="line ${done ? 'done' : ''}"></div>` : ''}
        `;
      }).join('');

      root.innerHTML = `
        <p class="eyebrow">— your path</p>
        <p class="reframe">${esc(state.reframe)}</p>
        <div class="trail">
          <div class="rail">${railHtml}</div>
          <div class="steps">${stepsHtml}</div>
        </div>
        <div class="restart"><button class="ghost" id="restart">start a new question</button></div>
      `;

      root.querySelectorAll('[data-notes-idx]').forEach(el => {
        el.addEventListener('input', e => { state.notes[el.dataset.notesIdx] = e.target.value; });
      });
      const advBtn = root.querySelector('[data-advance]');
      if (advBtn) advBtn.addEventListener('click', () => { state.revealed = Math.min(state.revealed + 1, total); render(); });
      const restartBtn = document.getElementById('restart');
      if (restartBtn) restartBtn.addEventListener('click', resetAll);
      const reflectEl = document.getElementById('reflect');
      if (reflectEl) reflectEl.addEventListener('input', e => state.reflection = e.target.value);
      const checkBtn = document.getElementById('check');
      if (checkBtn) checkBtn.addEventListener('click', onCheck);
    }
  }

  function renderFinal() {
    return `
      <div class="final">
        <p class="final-label">Your conclusion</p>
        <p class="final-text">You've worked the whole path. What's your answer now — and what's your reasoning?</p>
        <textarea class="notes" id="reflect" placeholder="Write what you now believe the answer is, and why.">${esc(state.reflection)}</textarea>
        <div class="advance">
          <button class="btn" id="check" ${state.feedbackLoading ? 'disabled' : ''}>${state.feedbackLoading ? 'Reading…' : 'Check my reasoning'}</button>
        </div>
        ${state.feedback ? `<div class="feedback">${esc(state.feedback)}</div>` : ''}
      </div>
    `;
  }

  async function onBegin() {
    if (!state.question.trim()) return;
    state.phase = 'loading';
    state.errorMsg = '';
    render();
    try {
      const guide = await generateGuide(state.question.trim());
      state.reframe = guide.reframe;
      state.steps = guide.steps;
      state.revealed = 1;
      state.notes = {};
      state.reflection = '';
      state.feedback = '';
      state.phase = 'guide';
    } catch (err) {
      state.phase = 'intro';
      state.errorMsg = 'Could not build a guide just now (' + err.message + ') — mind trying again?';
    }
    render();
  }

  async function onCheck() {
    state.feedbackLoading = true;
    render();
    try {
      state.feedback = await generateFeedback();
    } catch (err) {
      state.feedback = "Couldn't fetch feedback just now — try again in a moment.";
    }
    state.feedbackLoading = false;
    render();
  }

  function resetAll() {
    state.phase = 'intro';
    state.question = '';
    state.reframe = '';
    state.steps = [];
    state.revealed = 1;
    state.notes = {};
    state.reflection = '';
    state.feedback = '';
    state.errorMsg = '';
    render();
  }

  render();
})();
</script>
</body>
</html>
